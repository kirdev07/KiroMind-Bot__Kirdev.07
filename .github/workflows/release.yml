# Builds a signed APK for a version tag and publishes it as a GitHub Release
# that the app's self-updater understands (APK + <apk>.sha256).
#
# Trigger: git tag v1.0.1 && git push origin v1.0.1
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   KIROMIND_KEYSTORE_BASE64   base64 of the release .jks
#   KIROMIND_KEYSTORE_PASSWORD
#   KIROMIND_KEY_ALIAS
#   KIROMIND_KEY_PASSWORD
name: Release APK

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    # Pinned: this image ships the Android SDK; ubuntu-latest is moving to a new release.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships the Android SDK. Only the licenses are accepted here;
      # the Android Gradle plugin downloads the exact compile platform it needs.
      - name: Accept SDK licenses
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KIROMIND_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.KIROMIND_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.KIROMIND_KEY_ALIAS }}
          KEY_PW: ${{ secrets.KIROMIND_KEY_PASSWORD }}
        # ::error:: lines appear as annotations; they name the problem, never a secret's value.
        run: |
          for name in KEYSTORE_BASE64 STORE_PW ALIAS KEY_PW; do
            [ -n "${!name}" ] || { echo "::error::secret for $name is empty or not set (check the exact secret name)"; exit 1; }
          done
          # Pasting into the web form can add spaces or line breaks; base64 never contains them.
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"; then
            echo "::error::KIROMIND_KEYSTORE_BASE64 is not valid base64 (length ${#KEYSTORE_BASE64})"; exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$STORE_PW" -alias "$ALIAS" > /dev/null 2>&1; then
            echo "::error::keystore decoded, but the password or alias does not match"; exit 1
          fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest -PappVersion=${{ steps.v.outputs.version }}

      - name: Build signed release
        env:
          KIROMIND_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KIROMIND_KEYSTORE_PASSWORD: ${{ secrets.KIROMIND_KEYSTORE_PASSWORD }}
          KIROMIND_KEY_ALIAS: ${{ secrets.KIROMIND_KEY_ALIAS }}
          KIROMIND_KEY_PASSWORD: ${{ secrets.KIROMIND_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PappVersion=${{ steps.v.outputs.version }}

      - name: Name and checksum
        id: apk
        run: |
          name="KiroMind-Bot-${{ steps.v.outputs.version }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$name"
          sha256sum "$name" > "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # A re-pushed tag of an existing release replaces its files and keeps the description.
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber \
              "${{ steps.apk.outputs.name }}" "${{ steps.apk.outputs.name }}.sha256"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.apk.outputs.name }}" "${{ steps.apk.outputs.name }}.sha256" \
            --title "KiroMind Bot ${{ steps.v.outputs.version }}" \
            --notes "SHA-256: $(cut -d' ' -f1 "${{ steps.apk.outputs.name }}.sha256")"
