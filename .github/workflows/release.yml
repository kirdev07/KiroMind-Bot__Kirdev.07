# Builds a signed APK for a version tag and publishes it as a GitHub Release
# that the app's self-updater understands (APK + <apk>.sha256).
#
# Trigger: git tag v1.0.1 && git push origin v1.0.1
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   KIROMIND_KEYSTORE_BASE64   base64 of the release .jks
#   KIROMIND_KEYSTORE_PASSWORD
#   KIROMIND_KEY_ALIAS
#   KIROMIND_KEY_PASSWORD
name: Release APK

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    # Pinned: this image ships the Android SDK; ubuntu-latest is moving to a new release.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships the Android SDK. Only the licenses are accepted here;
      # the Android Gradle plugin downloads the exact compile platform it needs.
      - name: Accept SDK licenses
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KIROMIND_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KIROMIND_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest -PappVersion=${{ steps.v.outputs.version }}

      - name: Build signed release
        env:
          KIROMIND_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KIROMIND_KEYSTORE_PASSWORD: ${{ secrets.KIROMIND_KEYSTORE_PASSWORD }}
          KIROMIND_KEY_ALIAS: ${{ secrets.KIROMIND_KEY_ALIAS }}
          KIROMIND_KEY_PASSWORD: ${{ secrets.KIROMIND_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PappVersion=${{ steps.v.outputs.version }}

      - name: Name and checksum
        id: apk
        run: |
          name="KiroMind-Bot-${{ steps.v.outputs.version }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$name"
          sha256sum "$name" > "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.apk.outputs.name }}" "${{ steps.apk.outputs.name }}.sha256" \
            --title "KiroMind Bot ${{ steps.v.outputs.version }}" \
            --notes "SHA-256: $(cut -d' ' -f1 "${{ steps.apk.outputs.name }}.sha256")"
